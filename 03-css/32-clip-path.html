<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section{
            div.clip{
                background: url(../src/imgs/pittsburgh.jpg) no-repeat center /cover;
                border-radius: 14px;
                corner-shape: squircle;
                margin: 0 auto;
                height: 300px;
                transition: all 0.4s ease-in;
                width: 300px;

                &.clip1 {
                    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);

                    &:hover{
                        clip-path: polygon(50% 0%, 100% 0, 100% 33%, 100% 61%, 100% 100%, 51% 100%, 0 100%, 0 58%, 0 36%, 0 0);
                    }
                }
                &.clip2 {
                    clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);

                    &:hover{
                        clip-path: polygon(0 0, 0% 20%, 0 50%, 0% 80%, 0 100%, 50% 100%, 100% 100%, 100% 80%, 100% 48%, 100% 20%, 100% 0, 50% 0);
                    }
                }
                &.clip3 {
                    clip-path: polygon(0% 0%, 100% 0, 100% 75%, 100% 100%, 75% 100%, 42% 100%, 0 100%);

                    &:hover{
                        clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 75% 75%, 75% 100%, 50% 75%, 0% 75%);
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" fill="#e8e8e8" viewBox="0 0 256 256"><path d="M232,184a8,8,0,0,1-16,0A88,88,0,0,0,65.78,121.78L43.4,144H88a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V88a8,8,0,0,1,16,0v44.77l22.48-22.33A104,104,0,0,1,232,184Z"></path></svg>    </a>
    <main>
        <header class="mainmenu">
            <h1>32-clip-path</h1>
            <h4>Property lets you clip an element to a basic shape.</h4>
        </header>
        <section>
            <h4>Example 01</h4>
            <div class="clip clip1"></div>
            <h4>Example 02</h4>
            <div class="clip clip2"></div>
            <h4>Example 03</h4>
            <div class="clip clip3"></div>
        </section>
    </main>
</body>
</html>
