<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-steps</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        :root{
            --size: 256px;
        }
        section {
            div.bg{
                background: url(../src/imgs/bg-steps.png) no-repeat center;
                background-size: cover;
                height: 600px;
                width: 320px;
                border-radius: 12px;
                corner-shape: squircle;
                outline: 4px solid #000;
                position: relative;

                div#trainer{
                    background: url(../src/imgs/steps-all.png) no-repeat;
                    height: var(--size);
                    margin: 0 auto;
                    position: absolute;
                    bottom: 2rem;
                    left: 2rem;
                    transform: scale(.8);
                    width: var(--size);
                    animation: .8s animTrainer steps(4) infinite;

                    &.front {background-position-y: 0;}
                    &.left  {background-position-y: calc(var(--size) * -1);}
                    &.right {background-position-y: calc(Var(--size) * -2);}
                    &.back  {background-position-y: calc(var(--size) * -3);}
                }
            }
        }

        @keyframes animTrainer {
            100%{
                background-position-x: -1024px;
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" fill="#e8e8e8" viewBox="0 0 256 256"><path d="M232,184a8,8,0,0,1-16,0A88,88,0,0,0,65.78,121.78L43.4,144H88a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V88a8,8,0,0,1,16,0v44.77l22.48-22.33A104,104,0,0,1,232,184Z"></path></svg>    </a>
    <main>
        <header class="mainmenu">
            <h1>40-steps</h1>
            <h4>Allows step-by-step animation of a sprite.</h4>
        </header>
        <section>
            <div class="bg">
                <div id="trainer"></div>
            </div>
        </section>
    </main>
</body>
</html>
